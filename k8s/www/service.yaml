apiVersion: v1
kind: Service
metadata:
  name: www
  namespace: apps-singhsabha
  labels:
    app: www
spec:
  type: ClusterIP
  selector:
    app: www
  ports:
    - name: http
      port: 4000
      targetPort: 4000
    - name: metrics
      port: 4021
      targetPort: 4021
---
apiVersion: v1
kind: Service
metadata:
  name: www-headless
  namespace: apps-singhsabha
spec:
  clusterIP: None
  selector:
    app: www
